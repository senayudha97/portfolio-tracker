<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Rebalancing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8;
    --blue:#3b82f6; --blue-d:#2563eb; --emerald:#10b981; --amber:#f59e0b; --red:#ef4444;
    --ok:#10b981; --under:#f59e0b; --over:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    letter-spacing:-.01em;
    background:var(--bg);
    background-image:linear-gradient(180deg,#0f172a 0%,#111c33 60%,#0f172a 100%);
    min-height:100vh; padding:28px 16px 60px;
  }
  .wrap{max-width:1060px;margin:0 auto}
  h1{font-size:30px;margin:0 0 4px;font-weight:800;letter-spacing:-.03em;color:#f8fafc}
  .sub{color:var(--muted);margin:0 0 24px;font-size:15px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:22px 24px;margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .card h2{font-size:16px;margin:0 0 16px;font-weight:700;letter-spacing:-.01em;color:#f1f5f9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  input,select{
    font-family:inherit;font-size:15px;padding:11px 14px;border-radius:8px;
    border:1px solid var(--line);background:#0f172a;color:var(--ink);outline:none;width:100%;
  }
  input::placeholder{color:#64748b}
  option{background:#0f172a;color:var(--ink)}
  input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.25)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .row>*{flex:1;min-width:150px}
  button{
    font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;
    border-radius:8px;padding:11px 20px;background:var(--blue-d);color:#fff;
    transition:filter .12s, background .12s;
  }
  button:hover{filter:brightness(1.12)}
  button.mini{padding:6px 12px;font-size:12px;border-radius:6px;background:#334155;color:#e2e8f0;border-color:#475569}
  button.del{background:#7f1d1d;color:#fecaca;border-color:#991b1b}
  .badge{
    display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:700;
    padding:14px 22px;border-radius:10px;border:1px solid;
  }
  .badge.healthy{background:rgba(16,185,129,.12);border-color:#10b981;color:#34d399}
  .badge.sick{background:rgba(239,68,68,.12);border-color:#ef4444;color:#f87171}
  .total{font-size:26px;font-weight:700;margin-top:12px;color:#f8fafc}
  .cls-row{padding:12px 0;border-bottom:1px solid #293548}
  .cls-row:last-child{border-bottom:none}
  .cls-head{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px;gap:8px}
  .bar{height:8px;border-radius:4px;background:#0f172a;border:1px solid #293548;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
  .s-ok>i{background:var(--ok)} .s-under>i{background:var(--under)} .s-over>i{background:var(--over)}
  .pill{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:600;font-family:ui-monospace,Menlo,monospace;letter-spacing:0}
  .p-ok{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.4)}
  .p-under{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
  .p-over{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.4)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  td{padding:10px;border-top:1px solid #293548}
  .entry{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0f172a;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:14px}
  .muted{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:22px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

const CLASSES = ["Saham IDX","Saham US (S&P500)","Obligasi","Reksadana","Emas","Crypto","Deposito","Properti","Cash","P2P Lending","SBN","Valuta Asing"];
const PASTEL = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#64748b","#84cc16","#f97316","#14b8a6","#a855f7","#eab308"];
const rp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');

function Donut({ computed }) {
  const ref = useRef(null); const chart = useRef(null);
  useEffect(() => {
    const labels=[], data=[], colors=[];
    CLASSES.forEach((c,i)=>{ const v=computed[c]; if(v&&v.value>0){labels.push(c);data.push(v.value);colors.push(PASTEL[i%PASTEL.length]);} });
    if (chart.current) chart.current.destroy();
    if (!labels.length) { labels.push('Belum ada data'); data.push(1); colors.push('#334155'); }
    chart.current = new Chart(ref.current, {
      type:'doughnut',
      data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#1e293b'}]},
      options:{cutout:'66%',plugins:{legend:{position:'bottom',labels:{color:'#cbd5e1',font:{family:'Inter',size:12},boxWidth:10,padding:12,usePointStyle:true}}}}
    });
  }, [JSON.stringify(computed)]);
  return html`<canvas id="donut" ref=${ref} height="260"></canvas>`;
}

function Growth({ history }) {
  const ref = useRef(null); const chart = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chart.current) chart.current.destroy();
    const labels = history.map(x => new Date(x.ts).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}));
    const data = history.map(x => x.total);
    chart.current = new Chart(ref.current, {
      type:'line',
      data:{labels,datasets:[{label:'Total Portofolio',data,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.15)',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:'#3b82f6',borderWidth:2}]},
      options:{
        plugins:{
          legend:{labels:{color:'#cbd5e1',font:{family:'Inter',size:12},usePointStyle:true,boxWidth:10}},
          tooltip:{callbacks:{label:c=>'Rp '+Number(c.parsed.y||0).toLocaleString('id-ID')}}
        },
        scales:{
          x:{ticks:{color:'#94a3b8',font:{family:'Inter',size:10},maxTicksLimit:8},grid:{color:'#293548'}},
          y:{ticks:{color:'#94a3b8',font:{family:'Inter',size:10},callback:v=>'Rp '+Number(v).toLocaleString('id-ID')},grid:{color:'#293548'}}
        }
      }
    });
  }, [JSON.stringify(history)]);
  return html`<canvas id="growth" ref=${ref} height="110"></canvas>`;
}

function App() {
  const [d,setD] = useState(null);
  const [hist,setHist] = useState([]);
  const [drafts,setDrafts] = useState({});
  const [editing,setEditing] = useState(null);
  const [ep,setEp] = useState('');

  const loadHist = () => fetch('/api/history').then(r=>r.json()).then(j=>setHist(j.history||[]));
  const load = () => fetch('/api/portfolio').then(r=>r.json()).then(setD);
  useEffect(()=>{ load(); loadHist(); const t=setInterval(load,60000); return ()=>clearInterval(t); },[]);

  const updateValue = async c => {
    const raw = drafts[c];
    const val = Number(String(raw===undefined||raw===null?'':raw).replace(/\D/g,''));
    if (!isFinite(val)) return alert('Nilai tidak valid.');
    const r = await fetch('/api/portfolio/value',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({class:c,value:val})});
    if (r.ok) { setD(await r.json()); setDrafts(s=>({...s,[c]:undefined})); loadHist(); }
  };
  const savePrice = async c => {
    const r = await fetch('/api/prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[c]:{price:Number(ep)||0}})});
    setD(await r.json()); setEditing(null);
  };
  const saveTarget = async (c,v) => {
    const r = await fetch('/api/targets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[c]:Number(v)||0})});
    setD(await r.json());
  };

  if (!d) return html`<div class="wrap"><p class="empty">Memuat...</p></div>`;

  return html`<div class="wrap">
    <h1>Portfolio Rebalancing Tracker</h1>
    <p class="sub">Pantau alokasi aset dan jaga portofolio tetap seimbang.</p>

    <div class="card" style="text-align:center">
      <div id="health" class=${'badge '+(d.healthy?'healthy':'sick')}>
        ${d.healthy ? 'Portofolio Sehat ✅' : 'Perlu Rebalancing ⚠️'}
      </div>
      <div class="total">Total: ${rp(d.total)}</div>
      <div class="muted">toleransi ±${d.tolerance}% dari target</div>
    </div>

    <div class="card">
      <h2>✏️ Nilai Terkini per Asset Class</h2>
      <div class="muted" style="margin-bottom:12px">Isi nilai Rupiah terkini tiap kelas. Setiap update menimpa nilai lama dan tersimpan ke history.</div>
      ${CLASSES.map(c=>{ const cur = (d.values&&d.values[c])||0;
        const dv = drafts[c];
        const shown = dv===undefined||dv===null ? (cur?Number(cur).toLocaleString('id-ID'):'') : dv;
        return html`<div class="row" style="margin-bottom:8px">
          <span style="flex:1.4;min-width:150px;font-weight:600;font-size:14px">${c}
            <span class="muted" style="display:block;font-weight:400">sekarang: ${rp(cur)}</span></span>
          <input placeholder="Nilai (Rp)" value=${shown}
            onInput=${e=>{const v=e.target.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); setDrafts(s=>({...s,[c]:v}));}} />
          <button class="mini" style="flex:0 0 auto" onClick=${()=>updateValue(c)}>Update</button>
        </div>`;
      })}
    </div>

    <div class="grid2">
      <div class="card">
        <h2>🍩 Porsi Portofolio</h2>
        <${Donut} computed=${d.computed} />
      </div>
      <div class="card">
        <h2>📊 Aktual vs Target</h2>
        ${CLASSES.map(c=>{ const v=d.computed[c]; if(!v) return null;
          if (v.value===0 && v.target===0) return null;
          return html`<div class="cls-row">
            <div class="cls-head">
              <span>${c} <span class=${'pill p-'+v.status}>${v.status==='ok'?'pas':v.status==='under'?'kurang':'lebih'}</span></span>
              <span>${v.pct}% <span class="muted">/ ${v.target}%</span></span>
            </div>
            <div class=${'bar s-'+v.status}><i style=${'width:'+Math.min(100,v.pct)+'%'}></i></div>
            <div class="muted" style="margin-top:5px">${rp(v.value)} · selisih ${v.diff>0?'+':''}${v.diff}%
              <input type="number" value=${v.target} style="width:70px;display:inline-block;padding:3px 8px;font-size:12px;margin-left:8px"
                onChange=${e=>saveTarget(c,e.target.value)} /> % target
            </div>
          </div>`;
        })}
      </div>
    </div>

    <div class="card">
      <h2>💰 Tabel Harga Acuan</h2>
      <table>
        <thead><tr><th>Asset Class</th><th>Origin Price</th><th>Currency</th><th>Status</th><th>Updated</th><th>Note</th><th></th></tr></thead>
        <tbody>
        ${CLASSES.map(c=>{ const p=d.prices[c]||{};
          const hasPrice = p.price!==null && p.price!==undefined && p.price!=='';
          return html`<tr>
            <td style="font-weight:600">${c}</td>
            <td>${editing===c
              ? html`<input type="number" value=${ep} onInput=${e=>setEp(e.target.value)} style="width:130px;padding:5px 10px" />`
              : (hasPrice ? Number(p.price).toLocaleString('id-ID') : '-')}</td>
            <td>${p.currency||'-'}</td>
            <td>${p.live
              ? html`<span class="pill p-ok" title="harga otomatis dari API">🟢 LIVE</span>`
              : html`<span class="muted">static</span>`}</td>
            <td class="muted">${p.updatedAt ? new Date(p.updatedAt).toLocaleString('id-ID') : '-'}</td>
            <td class="muted">${p.note||'-'}</td>
            <td>${editing===c
              ? html`<button class="mini" onClick=${()=>savePrice(c)}>simpan</button>`
              : html`<button class="mini" onClick=${()=>{setEditing(c);setEp(p.price);}}>edit</button>`}</td>
          </tr>`;
        })}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>📈 Pertumbuhan Portofolio</h2>
      ${hist.length===0
        ? html`<div class="empty">Belum ada history. Update nilai asset dulu ya 🌱</div>`
        : html`<${Growth} history=${hist} />`}
      <div class="muted" style="margin-top:8px">${hist.length} snapshot tersimpan (maks 500)</div>
    </div>
  </div>`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
